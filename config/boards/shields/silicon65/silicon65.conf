CONFIG_ZMK_IDLE_TIMEOUT=120000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
#nkro
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y


# CONFIG_ZMK_RGB_UNDERGLOW=y
# 禁用 ZMK 内置 RGB Underglow（由自定义 RGB Matrix 取代）
# CONFIG_ZMK_RGB_UNDERGLOW is not set
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# 不能定义RGB自动熄灯，因为基于RGB_UNDERGLOW
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# 持久化存储（RGB 设置保存到 flash）
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# RGB 设置持久化禁用（设为负值则完全跳过 Flash 写入）
# 用于排查 Flash 擦写是否与 RGB 卡死有关；若禁用后卡死消失，则根因确认为 Flash
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=-1

CONFIG_ZMK_EXT_POWER=y

# HID 指示灯支持（Caps/Num/Scroll Lock 检测）
CONFIG_ZMK_HID_INDICATORS=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
